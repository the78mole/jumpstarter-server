---
# Kubernetes manifest: cert-manager ClusterIssuer (self-signed) for local dev
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-issuer
spec:
  selfSigned: {}
---
# CA Certificate issued by the self-signed issuer
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: jumpstarter-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: jumpstarter-ca
  secretName: jumpstarter-ca-secret
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: selfsigned-issuer
    kind: ClusterIssuer
    group: cert-manager.io
---
# CA ClusterIssuer backed by the generated CA
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: jumpstarter-ca-issuer
spec:
  ca:
    secretName: jumpstarter-ca-secret
