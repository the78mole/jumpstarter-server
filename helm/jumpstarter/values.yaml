# Helm values for Jumpstarter Controller
# Chart source: https://github.com/jumpstarter-dev/jumpstarter
#               controller/deploy/helm/jumpstarter

global:
  # Used to construct gRPC endpoint FQDNs; localhost is sufficient for a
  # single-node k3d development cluster.
  baseDomain: "localhost"
  metrics:
    enabled: false

jumpstarter-controller:
  # Use NodePort so the controller gRPC is reachable directly, without
  # requiring a full Ingress/TLS chain.  Port 30010/30011 are mapped by
  # k3d via the 8083 hostPort and can also be reached on the cluster IP.
  grpc:
    nodeport:
      enabled: true
      port: 30010
      routerPort: 30011
    traefik.ingress.kubernetes.io/router.tls: "true"
  hosts:
    - host: jumpstarter.local
      paths:
        - path: /
          pathType: Prefix
          service:
            name: jumpstarter-controller
            port: 8082
  tls:
    - secretName: jumpstarter-tls
      hosts:
        - jumpstarter.local

# cert-manager ClusterIssuer name used for TLS certificates
certIssuerName: "selfsigned-issuer"

# OIDC / authentication (set to empty for local dev)
auth:
  enabled: false
  oidcIssuerURL: ""
  clientID: ""
