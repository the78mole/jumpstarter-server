# Helm values for Jumpstarter Controller
# Chart source: https://github.com/jumpstarter-dev/jumpstarter
#               controller/deploy/helm/jumpstarter
#
# Only keys permitted by the chart's values.schema.json are used here.
# Top-level allowed: global, jumpstarter-controller, login

global:
  # Used to construct gRPC endpoint FQDNs. nip.io resolves *.127.0.0.1 to
  # 127.0.0.1, which is enough for a single-node k3d dev cluster.
  baseDomain: "127.0.0.1.nip.io"
  metrics:
    enabled: false

jumpstarter-controller:
  # Use ingress mode (not OpenShift Route) so the chart works on
  # standard Kubernetes (k3d/kind). NodePorts are used for local access.
  grpc:
    mode: "ingress"
    nodeport:
      enabled: true
      port: 30010
      routerPort: 30011
