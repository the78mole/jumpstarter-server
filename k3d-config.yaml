---
# k3d cluster configuration for Jumpstarter-in-a-Box
# Reference: https://k3d.io/v5.6.0/usage/configfile/
apiVersion: k3d.io/v1alpha5
kind: Simple

metadata:
  name: jumpstarter

# Single server node with two agent nodes
servers: 1
agents: 0

image: rancher/k3s:v1.29.3-k3s1

# Kubeconfig merge settings
kubeAPI:
  host: "0.0.0.0"
  hostIP: "0.0.0.0"
  hostPort: "6443"

ports:
  # HTTP for Traefik ingress
  - port: 8080:80
    nodeFilters:
      - loadbalancer
  # HTTPS / gRPC (HTTP/2) via Traefik ingress
  - port: 8082:443
    nodeFilters:
      - loadbalancer
  # Jumpstarter router gRPC (direct NodePort, no TLS termination)
  - port: 8083:8083
    nodeFilters:
      - loadbalancer

options:
  k3s:
    extraArgs:
      # Disable the default Traefik v1 so we can install Traefik v2 via Helm.
      # servicelb (klipper-lb) must stay enabled so that Traefik's
      # service.type=LoadBalancer gets a node-local binding that k3d's nginx
      # proxy can reach via the 8080/8082/8083 port mappings.
      - arg: "--disable=traefik"
        nodeFilters:
          - server:*
  kubeconfig:
    updateDefaultKubeconfig: true
    switchCurrentContext: true

volumes: []

registries:
  create:
    name: jumpstarter-registry
    host: "0.0.0.0"
    hostPort: "5111"
